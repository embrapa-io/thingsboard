services:
  kafka:
    restart: unless-stopped
    # Kafka 4.0.0 is affected by KAFKA-19888, which can break the group
    # coordinator and make ThingsBoard telemetry requests time out.
    image: bitnamilegacy/kafka:3.9.0
    ports:
      - ${PORT_KAFKA}:9092
      - 9093
      - 9094
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: "OUTSIDE://:9092,CONTROLLER://:9093,INSIDE://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "OUTSIDE://localhost:9092,INSIDE://kafka:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INSIDE"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker" #KRaft
      KAFKA_CFG_NODE_ID: "0" #KRaft
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER" #KRaft
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093" #KRaft
    volumes:
      - kafka_data:/bitnami
    networks:
      - io
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9094; exit $$?;'"
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 60s

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: thingsboard
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - io
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready', '-d', 'thingsboard' ]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s

  thingsboard:
    image: thingsboard/tb-node:4.3.1-latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "${PORT_MQTT:-1883}:1883"
      - "${PORT_MQTTS:-8883}:8883"
      - "${PORT_EDGE_RPC}:7070"
      - "5683-5688:5683-5688/udp"
    environment:
      TB_SERVICE_ID: tb-ce-node
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9094
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # O transporte MQTT precisa permanecer habilitado para que MQTTS funcione.
      # O listener simples fica preso ao loopback até MQTT_BIND_ADDRESS ser
      # explicitamente alterado para um endereço externo.
      MQTT_ENABLED: "${MQTT_ENABLED:-true}"
      MQTT_BIND_ADDRESS: "${MQTT_BIND_ADDRESS:-127.0.0.1}"
      MQTT_BIND_PORT: "1883"
      MQTT_SSL_ENABLED: "true"
      MQTT_SSL_BIND_ADDRESS: "0.0.0.0"
      MQTT_SSL_BIND_PORT: "8883"
      MQTT_SSL_PROTOCOL: "TLSv1.2"
      MQTT_SSL_CREDENTIALS_TYPE: "PEM"
      MQTT_SSL_PEM_CERT: /etc/thingsboard/certs/server.pem
      MQTT_SSL_PEM_KEY: /etc/thingsboard/certs/server_key.pem
      TB_TRANSPORT_SSL_CERTIFICATE_RELOAD_ENABLED: "true"
    volumes:
      - tb_data:/data
      - log_data:/var/log/thingsboard
      - ./certs/server.pem:/etc/thingsboard/certs/server.pem:ro
      - ./certs/server_key.pem:/etc/thingsboard/certs/server_key.pem:ro
    networks:
      - io

  auth-gateway:
    build:
      context: ./auth-gateway
    restart: unless-stopped
    depends_on:
      thingsboard:
        condition: service_started
    environment:
      PORT: "3000"
      TB_URL: "${TB_AUTH_GATEWAY_URL:-http://thingsboard:8080}"
      TB_GATEWAY_TOKEN: "${TB_AUTH_GATEWAY_TOKEN:-}"
      TB_REQUEST_TIMEOUT_MS: "${TB_AUTH_GATEWAY_TIMEOUT_MS:-3000}"
      AUTH_GATEWAY_MAX_BODY_BYTES: "${TB_AUTH_GATEWAY_MAX_BODY_BYTES:-32768}"
    expose:
      - "3000"
    networks:
      - io
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      thingsboard:
        condition: service_started
      auth-gateway:
        condition: service_healthy
    ports:
      - "${PORT_WEB}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - io
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    ports:
      - "${PORT_PGADMIN}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - io

  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    volumes:
      - backup:/backups
    networks:
      - io
    links:
      - db
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=thingsboard
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    profiles:
      - test
      - production

# Execute:
# docker network create --driver=bridge --subnet=172.30.65.0/24 --gateway=172.30.65.1 io_thingsboard

networks:
  io:
    name: io_thingsboard
    external: true

volumes:
  kafka_data:
    name: ${VOLUME_KAFKA}
    external: true

  pg_data:
    name: ${VOLUME_DB}
    external: true

  tb_data:
    name: ${VOLUME_THINGSBOARD}
    external: true

  log_data:
    name: ${VOLUME_LOG}
    external: true

  pgadmin_data:
    name: ${VOLUME_PGADMIN}
    external: true

  backup:
    name: ${VOLUME_BACKUP}
    external: true
