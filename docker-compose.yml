services:
  kafka:
    restart: unless-stopped
    # Kafka 4.0.0 is affected by KAFKA-19888, which can break the group
    # coordinator and make ThingsBoard telemetry requests time out.
    image: bitnamilegacy/kafka:3.9.0
    ports:
      - "127.0.0.1:${PORT_KAFKA}:9092"
      - 9093
      - 9094
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: "OUTSIDE://:9092,CONTROLLER://:9093,INSIDE://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "OUTSIDE://localhost:9092,INSIDE://kafka:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INSIDE"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker" #KRaft
      KAFKA_CFG_NODE_ID: "0" #KRaft
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER" #KRaft
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093" #KRaft
    volumes:
      - kafka_data:/bitnami
    networks:
      - io
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9094; exit $$?;'"
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 60s

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: thingsboard
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - io
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready', '-d', 'thingsboard' ]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s

  thingsboard:
    image: thingsboard/tb-node:4.4.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    # Portas publicadas no host:
    #   127.0.0.1:${PORT_MQTT} MQTT         — só loopback; o nginx do host fronteia 1883 (plain) e
    #                                         8883 (TLS) e encaminha para cá com PROXY protocol
    #   0.0.0.0:${PORT_EDGE_RPC} gRPC       — sincronização dos ThingsBoard Edge das Unidades
    # A UI/REST (8080) não é publicada: só o serviço nginx desta stack chega a ela,
    # passando pelo auth-gateway e pelo telemetry-gateway. O nginx do host encaminha
    # o 443 para 127.0.0.1:${PORT_WEB}, que é o nginx desta stack.
    # Ver README ("Portas e transportes") e nginx/mqtt-stream.conf.
    # CoAP (5683-5688/udp) foi removido em set/2026: sem uso na plataforma e
    # apontado como exposição desnecessária (chamado CTIR #143916).
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${PORT_MQTT}:1883"
      - "${PORT_EDGE_RPC}:7070"
    environment:
      TB_SERVICE_ID: tb-ce-node
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9094
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Licença (4.4, BUSL 1.1). Com TB_LICENSE_SECRET, a chave do License Portal
      # tem prioridade. Sem chave, o servidor só sobe com TB_NON_PRODUCTION_USE=true
      # (cotas ilimitadas, aviso na interface e desligamento após 30 dias de uso
      # acumulado). A ativação fica no volume: fora dele, recriar o contêiner gera
      # outra instância e prende a vaga única do plano Free.
      NON_PRODUCTION_USE: "${TB_NON_PRODUCTION_USE:-false}"
      TB_LICENSE_SECRET: "${TB_LICENSE_SECRET:-}"
      TB_LICENSE_INSTANCE_DATA_FILE: /data/instance-license.data
      TB_ANONYMOUS_USAGE_REPORTING: "${TB_ANONYMOUS_USAGE_REPORTING:-false}"
      # PROXY protocol (v1/v2) no transporte MQTT: o nginx do host injeta o IP
      # real do device. Obrigatório: com isso ligado, TODA conexão precisa vir
      # pelo nginx (por isso o port binding acima é só em loopback).
      # Em desenvolvimento local, sem o nginx do host, use false no .env para
      # conectar devices direto em 127.0.0.1:${PORT_MQTT}.
      MQTT_PROXY_PROTOCOL_ENABLED: "${MQTT_PROXY_PROTOCOL_ENABLED:-true}"
      # Bloqueio nativo por IP: após N CONNECT com credencial inválida, o IP é
      # bloqueado por TB_TRANSPORT_IP_BLOCK_TIMEOUT ms e o evento vai ao log
      # ("IP address blocked due to constantly wrong credentials"), que o
      # fail2ban do host usa para banir no firewall (ver fail2ban/).
      # Limiares = padrão do ThingsBoard (10 falhas => 60 s). Bloqueio curto de
      # propósito: uma Unidade inteira pode sair por um único NAT, e um device
      # com token errado não deve derrubar os vizinhos por muito tempo. O ban
      # longo fica a cargo do fail2ban, só para abuso sustentado.
      TB_TRANSPORT_IP_RATE_LIMITS_ENABLED: "true"
      TB_TRANSPORT_MAX_WRONG_CREDENTIALS_PER_IP: "10"
      TB_TRANSPORT_IP_BLOCK_TIMEOUT: "60000"
      # Diálogo "Check connectivity" da UI: não sugerir CoAP (listener removido).
      DEVICE_CONNECTIVITY_COAP_ENABLED: "false"
    volumes:
      - tb_data:/data
      - log_data:/var/log/thingsboard
    networks:
      - io
    # A imagem tb-node loga apenas em STDOUT. Enviar ao journald (com tag) é o
    # que permite ao fail2ban ler o log do container (backend systemd).
    # `docker compose logs` continua funcionando com este driver.
    # O Docker Desktop não tem journald: em desenvolvimento local, use
    # TB_LOG_DRIVER=json-file no .env.
    logging:
      driver: "${TB_LOG_DRIVER:-journald}"
      options:
        tag: thingsboard

  auth-gateway:
    build:
      context: ./auth-gateway
    restart: unless-stopped
    depends_on:
      thingsboard:
        condition: service_started
    environment:
      PORT: "3000"
      TB_URL: "${TB_AUTH_GATEWAY_URL:-http://thingsboard:8080}"
      TB_GATEWAY_TOKEN: "${TB_AUTH_GATEWAY_TOKEN:-}"
      TB_REQUEST_TIMEOUT_MS: "${TB_AUTH_GATEWAY_TIMEOUT_MS:-3000}"
      AUTH_GATEWAY_MAX_BODY_BYTES: "${TB_AUTH_GATEWAY_MAX_BODY_BYTES:-32768}"
    expose:
      - "3000"
    networks:
      - io
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  telemetry-gateway:
    build:
      context: ./telemetry-gateway
    restart: unless-stopped
    environment:
      PORT: "3000"
      TELEMETRY_JWT_SECRET: "${TELEMETRY_JWT_SECRET:-}"
      TB_TELEMETRY_TOKEN: "${TB_TELEMETRY_TOKEN:-}"
      TELEMETRY_MAX_RANGE_DAYS: "${TELEMETRY_MAX_RANGE_DAYS:-31}"
      TELEMETRY_MAX_POINTS: "${TELEMETRY_MAX_POINTS:-500}"
    expose:
      - "3000"
    networks:
      - io
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      thingsboard:
        condition: service_started
      auth-gateway:
        condition: service_healthy
      telemetry-gateway:
        condition: service_healthy
    # Única entrada web da stack, só em loopback: o nginx do host encaminha o 443 para cá.
    ports:
      - "127.0.0.1:${PORT_WEB}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/static:/usr/share/nginx/html/embrapa:ro
    networks:
      io:
        # Nome inequívoco na rede compartilhada, usado pelo data source do
        # Grafana para chegar à camada de telemetria.
        aliases:
          - tb-web
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "None"
      # Login provisório pelo Embrapa I/O (auth proxy) até a fase do OAuth
      # GitLab. O header só é aceito de quem está na rede dedicada ao proxy.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: "${GRAFANA_AUTH_PROXY_WHITELIST}"
      GF_PLUGINS_PREINSTALL_SYNC: "yesoreyeram-infinity-datasource@${GRAFANA_INFINITY_VERSION}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      io:
        aliases:
          - grafana-iot
      grafana_proxy:
        aliases:
          - grafana-iot
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_PGADMIN}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - io

  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    volumes:
      - backup:/backups
    networks:
      - io
    links:
      - db
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=thingsboard
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    profiles:
      - test
      - production

# Execute:
# docker network create --driver=bridge --subnet=172.30.65.0/24 --gateway=172.30.65.1 io_thingsboard

networks:
  io:
    name: io_thingsboard
    external: true

  # Rede exclusiva entre o NGINX do dashboard do Embrapa I/O e o Grafana. O
  # whitelist do auth proxy aponta para a sub-rede dela.
  # docker network create --driver=bridge --subnet=172.30.67.0/24 --gateway=172.30.67.1 io_grafana
  grafana_proxy:
    name: ${GRAFANA_PROXY_NETWORK}
    external: true

volumes:
  kafka_data:
    name: ${VOLUME_KAFKA}
    external: true

  pg_data:
    name: ${VOLUME_DB}
    external: true

  tb_data:
    name: ${VOLUME_THINGSBOARD}
    external: true

  log_data:
    name: ${VOLUME_LOG}
    external: true

  pgadmin_data:
    name: ${VOLUME_PGADMIN}
    external: true

  backup:
    name: ${VOLUME_BACKUP}
    external: true

  grafana_data:
    name: ${VOLUME_GRAFANA}
    external: true
