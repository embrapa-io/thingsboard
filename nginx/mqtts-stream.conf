# MQTTS (8883) para o ThingsBoard Server — TLS terminado pelo nginx do host,
# forward em MQTT plain para o port binding do container (127.0.0.1:1883).
#
# Mesmo padrão adotado no boilerplate `thingsboard-edge` (Edges das Unidades).
# Reutiliza o certificado Let's Encrypt já emitido para o HTTPS (443): o
# cliente MQTTS conecta em iot.embrapa.io:8883 e o handshake valida o nome
# do host, não o protocolo — um único certificado atende 443 e 8883.
#
# Instalação (uma vez, no host):
#
#   sudo install -d /etc/nginx/stream.d
#   sudo install -m 0644 nginx/mqtts-stream.conf /etc/nginx/stream.d/mqtts.conf
#
# e, no nível top do /etc/nginx/nginx.conf (fora do bloco http {}), garantir:
#
#   stream {
#       include /etc/nginx/stream.d/*.conf;
#   }
#
# Requer o módulo stream (pacote `libnginx-mod-stream` no Ubuntu).
# Validar e aplicar: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8883 ssl;
    listen [::]:8883 ssl;

    ssl_certificate     /etc/letsencrypt/live/iot.embrapa.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.embrapa.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MQTTS:10m;
    ssl_session_timeout 1h;

    # MQTT plain interno (port binding do serviço `thingsboard` do compose)
    proxy_pass 127.0.0.1:1883;

    # Conexões MQTT são longas (keep-alive do device); não derrubar por ociosidade curta.
    proxy_timeout         1h;
    proxy_connect_timeout 10s;
}
