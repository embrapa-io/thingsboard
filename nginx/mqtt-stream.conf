# MQTT (1883) e MQTTS (8883) do ThingsBoard Server — fronteados pelo nginx do
# host, que encaminha para o port binding interno do container
# (127.0.0.1:${PORT_MQTT}, por padrão 1884) com PROXY protocol.
#
# Por que o nginx fica na frente das DUAS portas:
#   - 8883: termina TLS com o mesmo certificado Let's Encrypt do HTTPS (443).
#   - 1883: passthrough plain, apenas para injetar o cabeçalho PROXY protocol.
#   O ThingsBoard roda com MQTT_PROXY_PROTOCOL_ENABLED=true e, nesse modo,
#   exige o cabeçalho em toda conexão. É ele que entrega ao ThingsBoard o IP
#   real do device — sem isso, toda conexão chegaria como 127.0.0.1, e o
#   bloqueio nativo por IP (TB_TRANSPORT_IP_RATE_LIMITS_ENABLED) e o fail2ban
#   baniriam o próprio host.
#
# Instalação (uma vez, no host):
#
#   sudo apt install -y libnginx-mod-stream
#   sudo install -d /etc/nginx/stream.d
#   sudo install -m 0644 nginx/mqtt-stream.conf /etc/nginx/stream.d/mqtt.conf
#
# e, no nível top do /etc/nginx/nginx.conf (fora do bloco http {}), garantir:
#
#   stream {
#       include /etc/nginx/stream.d/*.conf;
#   }
#
# Validar e aplicar: sudo nginx -t && sudo systemctl reload nginx
# ATENÇÃO: o nginx só consegue escutar 1883 depois que o compose passar a
# publicar o MQTT do container em 127.0.0.1:1884 (docker compose up -d
# --force-recreate thingsboard); antes disso o docker-proxy ocupa a 1883.

# Limite de conexões simultâneas por IP de origem. Generoso de propósito: uma
# Unidade inteira pode sair por um único NAT. Ajuste se necessário.
limit_conn_zone $binary_remote_addr zone=mqtt_per_ip:10m;

# MQTT plain (1883) — passthrough + PROXY protocol
server {
    listen 1883;
    listen [::]:1883;

    limit_conn mqtt_per_ip 500;

    proxy_pass            127.0.0.1:1884;
    proxy_protocol        on;
    proxy_timeout         1h;
    proxy_connect_timeout 10s;
}

# MQTTS (8883) — TLS terminado pelo nginx + PROXY protocol
server {
    listen 8883 ssl;
    listen [::]:8883 ssl;

    ssl_certificate     /etc/letsencrypt/live/iot.embrapa.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.embrapa.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MQTTS:10m;
    ssl_session_timeout 1h;

    limit_conn mqtt_per_ip 500;

    proxy_pass            127.0.0.1:1884;
    proxy_protocol        on;
    proxy_timeout         1h;
    proxy_connect_timeout 10s;
}
