upstream thingsboard_backend {
  server thingsboard:8080;
  keepalive 32;
}

upstream auth_gateway {
  server auth-gateway:3000;
  keepalive 8;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 1m;
  large_client_header_buffers 4 8k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  limit_conn client_conn 40;
  limit_conn_status 429;
  limit_req_status 429;
  proxy_connect_timeout 3s;
  proxy_send_timeout 30s;
  proxy_read_timeout 60s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Server;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api/auth/login {
    limit_req zone=auth_login burst=5 nodelay;
    proxy_pass http://auth_gateway;
  }

  location = /api/auth/token {
    limit_req zone=auth_login burst=5 nodelay;
    proxy_pass http://auth_gateway;
  }

  location = /api/noauth/resetPasswordByEmail {
    limit_req zone=auth_recovery burst=2 nodelay;
    proxy_pass http://thingsboard_backend;
  }

  location = /api/noauth/resetPassword {
    limit_req zone=auth_recovery burst=2 nodelay;
    proxy_pass http://thingsboard_backend;
  }

  location = /api/noauth/activate {
    limit_req zone=auth_recovery burst=2 nodelay;
    proxy_pass http://thingsboard_backend;
  }

  location ^~ /api/noauth/ {
    proxy_pass http://thingsboard_backend;
  }

  location = /__auth {
    internal;
    proxy_pass http://auth_gateway/internal/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $manager_authorization;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
  }

  location /api/ {
    auth_request /__auth;
    proxy_pass http://thingsboard_backend;
    proxy_http_version 1.1;
  }

  location / {
    proxy_pass http://thingsboard_backend;
    proxy_http_version 1.1;
  }

  location = /api/ws {
    # O navegador não pode enviar Authorization no handshake WebSocket. O
    # ThingsBoard valida o JWT no fluxo nativo do WebSocket. A barreira
    # manager permanece no login, renovação e em todas as APIs HTTP.
    proxy_pass http://thingsboard_backend/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location ^~ /api/ws/ {
    # Endpoints de plugins do ThingsBoard usam JWT no próprio protocolo/query
    # do WebSocket; a validação é feita pelo ThingsBoard.
    proxy_pass http://thingsboard_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
