events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # O cliente web do ThingsBoard envia o JWT em X-Authorization; integrações
  # convencionais usam Authorization. O auth-gateway recebe ambos normalizados
  # como Authorization.
  map $http_x_authorization $manager_authorization {
    default $http_x_authorization;
    '' $http_authorization;
  }

  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=auth_recovery:10m rate=3r/m;
  limit_conn_zone $binary_remote_addr zone=client_conn:10m;

  include /etc/nginx/conf.d/*.conf;
}
