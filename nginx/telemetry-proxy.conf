# Proxy só da camada de telemetria (serviço telemetry-proxy do
# docker-compose.override.example.yml, usado em desenvolvimento).
#
# Em desenvolvimento, o ThingsBoard é acessado direto (RBAC nativo, 127.0.0.1:9095)
# e o nginx completo (nginx.conf + conf.d/thingsboard.conf) e o auth-gateway ficam
# desligados. A chave X-API-Key da aba Aplicações ainda precisa da camada de telemetria
# (TELEMETRY_PUBLIC_URL=http://localhost:9090/telemetry), assim como o backend do
# Embrapa I/O (http://tb-web/telemetry).
# Este arquivo mantém só essas rotas, copiadas de conf.d/thingsboard.conf sem mudar a
# lógica. Não há rotas de interface/API do ThingsBoard nem auth-gateway aqui.
# Em produção, o nginx completo continua sendo a entrada web e atende /telemetry.
# Ao mudar as rotas /telemetry de um arquivo, mude também no outro.

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  limit_conn_zone $binary_remote_addr zone=client_conn:10m;

  # As aplicações de um projeto podem consultar a telemetria a partir de um único IP;
  # por isso o limite é por credencial, não por IP. A chave da aba Aplicações vem
  # em X-API-Key (sem Authorization): contar os dois cabeçalhos para que ela
  # também entre no limite (no thingsboard.conf ela escapava, com chave vazia).
  limit_req_zone "$http_authorization$http_x_api_key" zone=telemetry:10m rate=30r/s;

  upstream thingsboard_backend {
    server thingsboard:8080;
    keepalive 32;
  }

  upstream telemetry_gateway {
    server telemetry-gateway:3000;
    keepalive 8;
  }

  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    # 16k comporta o JWT de projeto da camada de telemetria, que lista os
    # dispositivos vinculados (cerca de 40 bytes por dispositivo).
    large_client_header_buffers 4 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_conn client_conn 40;
    limit_conn_status 429;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Validador para a chave X-API-Key da aba Aplicações e para o JWT de projeto.
    # Ele confere a credencial, fixa o dispositivo e devolve a consulta normalizada;
    # somente ela chega ao ThingsBoard, com a credencial de serviço que nunca sai da stack.
    location = /__telemetry_auth {
      internal;
      proxy_pass http://telemetry_gateway/internal/authorize;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-API-Key $http_x_api_key;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
    }

    # Dispositivos que a chave de aplicação lê; respondido pelo próprio validador.
    location = /telemetry/devices {
      limit_req zone=telemetry burst=100 nodelay;
      limit_except GET { deny all; }
      proxy_pass http://telemetry_gateway/devices;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header X-API-Key $http_x_api_key;
      proxy_http_version 1.1;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /telemetry/ {
      limit_req zone=telemetry burst=100 nodelay;
      limit_except GET { deny all; }
      auth_request /__telemetry_auth;
      auth_request_set $telemetry_path $upstream_http_x_telemetry_path;
      auth_request_set $telemetry_query $upstream_http_x_telemetry_query;
      auth_request_set $telemetry_authorization $upstream_http_x_telemetry_authorization;

      # Um proxy_set_header na location anula os do server; repetir o Host evita
      # que o ThingsBoard receba "thingsboard_backend", que ele rejeita.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Authorization "";
      proxy_set_header X-API-Key "";
      proxy_set_header Cookie "";
      proxy_set_header X-Authorization $telemetry_authorization;
      proxy_pass http://thingsboard_backend/api/plugins/telemetry/$telemetry_path?$telemetry_query;
      proxy_http_version 1.1;
      proxy_hide_header Set-Cookie;
      # add_header no location substitui os do server; repetir os comuns.
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # O resto não existe aqui: o ThingsBoard é acessado direto (127.0.0.1:9095 / Tailscale).
    location / {
      return 404;
    }
  }
}
