# fail2ban jails — ThingsBoard Server (iot.embrapa.io)
#
# Instalação (uma vez, no host):
#   sudo apt install -y fail2ban python3-systemd
#   sudo install -m 0644 fail2ban/filter.d/thingsboard-mqtt.conf /etc/fail2ban/filter.d/
#   sudo install -m 0644 fail2ban/jail.d/thingsboard.conf        /etc/fail2ban/jail.d/
#   sudo systemctl enable --now fail2ban && sudo systemctl restart fail2ban
#   sudo fail2ban-client status thingsboard-mqtt
#
# Pré-requisito: o serviço `thingsboard` do compose usa o logging driver
# journald com tag "thingsboard" (ver docker-compose.yml), para que o
# fail2ban leia o log do container direto do journal (backend systemd).

[DEFAULT]
# Nunca banir o próprio host nem a rede Docker. Se uma Unidade sair por um
# único NAT e tiver devices que precisem de tolerância extra, acrescente o IP
# público dela aqui (separado por espaço).
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12

[thingsboard-mqtt]
enabled   = true
backend   = systemd
journalmatch = CONTAINER_TAG=thingsboard
filter    = thingsboard-mqtt
# Cada ocorrência no log já corresponde a 10 CONNECT com credencial inválida
# (TB_TRANSPORT_MAX_WRONG_CREDENTIALS_PER_IP) e a um bloqueio de 60 s feito
# pelo próprio ThingsBoard. O fail2ban só entra em abuso SUSTENTADO:
# 5 bloqueios (>= 50 CONNECT inválidos) em 30 min => ban de 1 h no firewall,
# nas duas portas MQTT. Para liberar: fail2ban-client set thingsboard-mqtt unbanip <IP>
maxretry  = 5
findtime  = 30m
bantime   = 1h
port      = 1883,8883
protocol  = tcp

[recidive]
# Reincidentes (banidos 3x em 1 dia por qualquer jail) ficam 1 semana fora, em todas as portas.
enabled   = true
logpath   = /var/log/fail2ban.log
banaction = %(banaction_allports)s
bantime   = 1w
findtime  = 1d
maxretry  = 3

[sshd]
enabled   = true
