# fail2ban filter — ThingsBoard: IP bloqueado por credenciais MQTT inválidas
#
# O ThingsBoard (TB_TRANSPORT_IP_RATE_LIMITS_ENABLED=true) conta os CONNECT
# com credencial inválida por IP e, ao atingir TB_TRANSPORT_MAX_WRONG_CREDENTIALS_PER_IP,
# bloqueia o IP por TB_TRANSPORT_IP_BLOCK_TIMEOUT e registra em INFO:
#
#   2026-09-08 18:00:00,123 [nioEventLoopGroup-4-2] INFO  o.t.s.c.t.l.DefaultTransportRateLimitService - [/203.0.113.7] IP address blocked due to constantly wrong credentials.
#
# O IP entre colchetes pode vir como "/1.2.3.4" ou "host/1.2.3.4" (InetAddress.toString()).
# Cada linha já representa N falhas (padrão 10); a jail conta essas linhas (maxretry).
#
# Fonte da linha: DefaultTransportRateLimitService.onAuthFailure() (ThingsBoard 4.3.1).

[INCLUDES]
before = common.conf

[Definition]
failregex = ^.*\[(?:[^\]/\s]*/)?<HOST>\] IP address blocked due to constantly wrong credentials\.?\s*$

ignoreregex =

# Os logs do container chegam pelo journal do Docker (logging driver journald);
# o carimbo de data usado pelo fail2ban é o do journal.
